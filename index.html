<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Baixe o Clustercord para celular Android ou Windows.">
  <title>Clustercord — Downloads</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --text: #111111;
      --muted: #626262;
      --line: #e7e7e7;
      --soft: #f7f7f8;
      --accent: #6d4aff;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page { width: min(100%, 960px); margin: 0 auto; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 0 36px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -.04em;
    }
    .brand-mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 2px solid #111;
      border-radius: 12px;
      font-size: 1.25rem;
      font-weight: 900;
    }

    .hero { text-align: center; margin-bottom: 38px; }
    .eyebrow {
      display: inline-block;
      padding: 7px 12px;
      border: 1px solid #dedede;
      border-radius: 999px;
      color: #444;
      background: #fafafa;
      font-size: .76rem;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 19px 0 13px;
      font-size: clamp(2.3rem, 6vw, 4.2rem);
      line-height: 1.04;
      letter-spacing: -.065em;
    }
    h1 span { color: var(--accent); }
    .intro {
      max-width: 570px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.12rem);
      line-height: 1.7;
    }

    .downloads {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }
    .download-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 8px 12px 18px;
      background: transparent;
    }
    .download-card:hover { transform: none; }
    .device-icon {
      width: 94px;
      height: 94px;
      display: grid;
      place-items: center;
      margin-bottom: 20px;
      border: 0;
      border-radius: 22px;
      background: #f7f7f8;
      color: #111;
    }
    .device-icon svg { width: 42px; height: 42px; }
    .download-card h2 {
      margin: 0 0 18px;
      font-size: 1.55rem;
      letter-spacing: -.04em;
    }
    .download-card p { display: none; }

    /* Botões estilo selo de download, inspirados na referência enviada */
    .download-badge {
      width: min(100%, 260px);
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 17px;
      border: 2px solid #111;
      border-radius: 10px;
      background: #111;
      color: #fff;
      text-decoration: none;
      transition: transform .18s ease, background .18s ease;
    }
    .download-badge:hover { transform: translateY(-2px); background: #292929; }
    .download-badge:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .badge-icon {
      flex: 0 0 38px;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
    }
    .badge-icon svg { width: 36px; height: 36px; }
    .badge-copy { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .badge-overline { font-size: .72rem; font-weight: 500; letter-spacing: .02em; }
    .badge-title { font-size: 1.25rem; font-weight: 750; line-height: 1.15; letter-spacing: -.025em; }

    .footnote {
      margin: 25px auto 0;
      max-width: 650px;
      color: #777;
      text-align: center;
      font-size: .83rem;
      line-height: 1.65;
    }

    .footer-logo {
      display: flex;
      justify-content: center;
      margin: 42px auto 0;
    }
    .clustercord-logo {
      display: block;
      width: 76px;
      height: 76px;
      object-fit: contain;
      border-radius: 18px;
    }

    @media (max-width: 640px) {
      body { padding: 20px 15px; }
      .topbar { padding: 8px 0 28px; }
      .hero { margin-bottom: 26px; }
      .downloads { grid-template-columns: 1fr; gap: 15px; }
      .download-card { padding: 8px 6px 18px; }
      .device-icon { margin-bottom: 15px; }
      
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <div class="brand" aria-label="Clustercord">
        <div class="brand-mark" aria-hidden="true">C</div>

        <a class="download-badge"

           download
           aria-label="Baixar Clustercord para Windows">
          <span class="badge-icon" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none" stroke="white" stroke-width="1.8" stroke-linejoin="round">
              <path d="M4 9.5 17.5 7.5v11H4Z" fill="white" stroke="none"/>
              <path d="M20 7 36 4.5v14H20Z" fill="white" stroke="none"/>
              <path d="M4 21.5h13.5v11L4 30.5Z" fill="white" stroke="none"/>
              <path d="M20 21.5h16v14L20 33Z" fill="white" stroke="none"/>

          <span class="badge-copy">
            <span class="badge-overline">DOWNLOAD PARA</span>

    </section>
